name: CI CD
on:
  push:
    branches: [main]

jobs:
  frontend-unit-test:
    name: Frontend - Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bugtracker-frontend
    container:
      image: node:24-alpine
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: npm ci
        run: npm ci
      - name: npm test
        run: npm test
      - name: Install git into container image node 24 alpine
        run: apk add --no-cache git
      - name: Publish Junit Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend - Junit Test Results
          path: bugtracker-frontend/test-results.xml
          reporter: java-junit