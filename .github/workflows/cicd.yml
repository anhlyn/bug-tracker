name: CI CD
on:
  push:
    branches: [main]

jobs:
  frontend-unit-test:
    name: Frontend - Unit Test
    needs: backend-unit-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node 24
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Running frontend unit test
        working-directory: bugtracker-frontend
        run: |
          npm ci
          npm test
          npm test | tee full_output.txt
          echo 'FRONTEND COVERAGE REPORT```' >> $GITHUB_STEP_SUMMARY
          cat full_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```'
      - name: Publish Junit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Report Frontend - Unit Test Result
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit
      - name: Upload Code Coverage Frontend Report
        uses: actions/upload-artifact@v4
        with:
          name: Report Frontend - Coverage Code
          path: bugtracker-frontend/coverage/index.html
          retention-days: 3

  backend-unit-test:
    name: Backend - Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bugtracker-backend

    steps:
      - uses: actions/checkout@v4

      - name: go mod download
        run: go mod download

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Execute Backend Unit Test
        run: |
          go test -json -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage.txt
          echo "BACKEND COVERAGE REPORT" >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY

          go test -v ./... 2>&1 | $(go env GOPATH)/bin/go-junit-report > test-results.xml
      - name: Publish Junit Test Result
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Reprot Backend - Unit Test Result
          path: bugtracker-backend/test-results.xml
          reporter: jest-junit
      - name: Upload backend unit coverage report
        uses: actions/upload-artifact@v4
        with:
          name: Report Backend - Coverage Code
          path: bugtracker-backend/coverage.html