name: CI CD
on:
  push:
    branches: [main]

jobs:
  frontend-unit-test:
    name: Frontend - Unit Test
    needs: backend-unit-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node 24
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Running frontend unit test
        working-directory: bugtracker-frontend
        run: |
          npm ci
          npm test
      - name: Publish Junit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Report Frontend - Unit Test Result
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit
      - name: Upload Code Coverage Frontend Report
        uses: actions/upload-artifact@v4
        with:
          name: Report Frontend - Coverage Code
          path: bugtracker-frontend/coverage/index.html
          retention-days: 3

  backend-unit-test:
    name: Backend - Unit Test
    runs-on: ubuntu-latest
    container:
      image: 'snakee/golang-junit:1.21'
    defaults:
      run:
        working-directory: bugtracker-backend

    steps:
      - uses: actions/checkout@v4

      - name: go mod download
        run: go mod download
      - name: Run test and generate JUnit XML
        run: |
          sh 'go test ./... -v 2>&1 | go run github.com/jstemmer/go-junit-report/v2@latest > test-backend-results.xml'
          sh 'go test -coverprofile=coverage.out -covermode=atomic ./...'
          sh 'go tool cover -html=coverage.out -o coverage.html'
          sh 'mkdir -p reports'
          sh 'mv coverage.html reports/coverage.html'
      - name: Publish Junit Test Result
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Reprot Backend - Unit Test Result
          path: bugtracker-backend/test-backend-result.xml
          reporter: jest-junit
      - name: Upload backend unit coverage report
        uses: actions/upload-artifact@v4
        with:
          name: Report Backend - Coverage Code
          path: bugtracker-backend/coverage.html